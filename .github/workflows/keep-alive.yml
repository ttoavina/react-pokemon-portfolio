name: Keep Render awake

on:
  schedule:
    # Every 13 minutes — fires at :00, :13, :26, :39, :52 within each hour.
    # Max gap between pings is 13 min, so Render's 15 min idle-spin-down never triggers.
    - cron: '*/13 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping backend /docs
        run: |
          set -euo pipefail
          URL="https://react-pokemon-portfolio.onrender.com/docs"
          echo "Pinging $URL"
          curl -fsS \
            --retry 3 --retry-delay 10 --retry-all-errors \
            --max-time 90 \
            -o /dev/null \
            -w "HTTP %{http_code} · %{time_total}s · resolved %{remote_ip}\n" \
            "$URL"
